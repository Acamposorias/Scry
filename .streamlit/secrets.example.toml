[database]
# Use "duckdb" locally, then switch to "motherduck" or "snowflake" when ready.
engine = "duckdb"
path = "data/app.duckdb"

# MotherDuck config for hosted DuckDB:
# engine = "motherduck"
# database = "warehouse_dashboard"
# token = "your_motherduck_token"

# Snowflake config for later:
# engine = "snowflake"
# account = "your_account"
# user = "your_user"
# password = "your_password"
# role = "your_role"
# warehouse = "your_warehouse"
# database = "your_database"
# schema = "PUBLIC"

# Multi-client hosted configuration:
# Users are fixed for the MVP. Generate password hashes with:
# python -c "from src.auth import hash_password; print(hash_password('change-me'))"
#
# [users.admin]
# name = "Admin"
# client_id = "client_a"
# password_hash = "pbkdf2_sha256$260000$replace_salt$replace_hash"
#
# [clients.client_a]
# name = "Client A"
#
# [clients.client_a.database]
# engine = "motherduck"
# database = "client_a_database"
# token = "your_motherduck_token"
#
# [clients.client_b]
# name = "Client B"
#
# [clients.client_b.database]
# engine = "motherduck"
# database = "client_b_database"
# token = "your_motherduck_token"
