[database]
# Use "duckdb" locally, then switch to "motherduck" or "snowflake" when ready.
engine = "duckdb"
path = "data/app.duckdb"

# MotherDuck config for hosted DuckDB:
# engine = "motherduck"
# database = "warehouse_dashboard"
# token = "your_motherduck_token"

# Snowflake config for later:
# engine = "snowflake"
# account = "your_account"
# user = "your_user"
# password = "your_password"
# role = "your_role"
# warehouse = "your_warehouse"
# database = "your_database"
# schema = "PUBLIC"

# Optional environment and tenant routing:
#
# [environment]
# name = "testing"
#
# Shared-token tenant databases:
# [database]
# engine = "motherduck"
# token = "your_motherduck_token"
#
# [tenants.pronto]
# name = "Pronto"
# database = "scry_test_pronto"
#
# [tenants.client_b]
# name = "Client B"
# database = "scry_test_client_b"
#
# Tenant-owned MotherDuck account/token:
# [tenants.pronto]
# name = "Pronto"
#
# [tenants.pronto.database]
# engine = "motherduck"
# database = "scry_prod_pronto"
# token = "pronto_motherduck_token"
